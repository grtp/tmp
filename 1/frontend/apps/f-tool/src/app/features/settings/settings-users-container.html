@if (errorMessage(); as msg) {
  <p class="error">{{ msg }}</p>
}

<tm-settings-page
  [activeTab]="tab()"
  [visibleTabs]="visibleTabs()"
  [users]="settingsUsers()"
  [actions]="settingsActions()"
  [loading]="loading()"
  (tabChanged)="tab.set($event)"
  (userLevelChanged)="onUserLevelChanged($event)"
/>
