<span class="wrap">
  <button
    class="user-btn"
    type="button"
    (click)="open.set(!open())"
    [attr.aria-expanded]="open()"
    [attr.aria-haspopup]="true"
  >
    <mat-icon class="ic" aria-hidden="true">person</mat-icon>
    {{ userName() }}
    <mat-icon class="caret ic" [class.up]="open()" aria-hidden="true">expand_more</mat-icon>
  </button>

  @if (open()) {
    <div class="drawer" role="menu">
      <button class="item" type="button" role="menuitem" (click)="onTop()">
        <mat-icon class="ic" aria-hidden="true">home</mat-icon>
        {{ 'common.backToTop' | transloco }}
      </button>
      <button class="item" type="button" role="menuitem" (click)="onLogout()">
        <mat-icon class="ic" aria-hidden="true">logout</mat-icon>
        {{ 'common.logout' | transloco }}
      </button>
    </div>
  }
</span>
