<div class="auth">
  <form class="card" (submit)="$event.preventDefault(); submit()">
    <div class="brand">
      <span class="mark">db</span>
      <h1>テーブル管理</h1>
      <p>社内アカウントでサインインしてください</p>
    </div>

    <label class="field">
      <span>ユーザー名</span>
      <input
        type="text"
        autocomplete="username"
        autofocus
        [value]="username()"
        (input)="username.set($any($event.target).value)"
      />
    </label>

    <label class="field">
      <span>パスワード</span>
      <input
        type="password"
        autocomplete="current-password"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button class="primary" type="submit" [disabled]="busy()">
      {{ busy() ? 'サインイン中…' : 'サインイン' }}
    </button>
  </form>
</div>
