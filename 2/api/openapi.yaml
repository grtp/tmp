openapi: 3.0.3
info:
  title: F-tool API
  version: 2.0.0
  description: |
    社内LAN向けテーブルメンテナンスツールのAPI (v2)。

    ## 認証
    LDAP(AD) bind 認証。成功時に不透明なセッションID を httpOnly cookie (`sid`)
    で発行し，セッション本体は Valkey(Redis 互換)に保存する(TTL 30分スライディング)。

    ## 認可(機能ごとの権限レベル)
    権限は機能(action)単位で `ftool_app_user_auth` に保存される。
    レベルは admin > maintainer > user の3段階で，行が無い機能は権限なし(403)。

    | 機能 code | user | maintainer | admin |
    |---|---|---|---|
    | table-maint | 行の閲覧 | + 追加/編集/削除 | 同左 |
    | settings    | - | - | 機能マスタ/ユーザー権限/管理テーブルの編集，履歴閲覧 |

    ## 管理対象テーブル
    admin が `POST /managed-tables` で任意の schema.table を登録すると，
    バックエンドが SQL Server のカタログからメタデータ(列/PK/型)を実行時に
    取得し，汎用の閲覧/編集 UI が動く。

    ## 監査
    全ての変更操作とログイン/ログアウトは `ftool_app_operation_history` に記録される。

    ## エラー
    すべてのエラーは `Error` スキーマで返る。認証切れは一律 401，
    権限不足は 403，存在しないリソースは 404。

servers:
  - url: /api/v1

tags:
  - name: auth
    description: LDAP認証とセッション(Valkey)
  - name: tables
    description: 管理対象テーブルの操作(メタデータ駆動)
  - name: connections
    description: 接続先 SQL Server の管理(admin)。既定接続(アプリ自身のDB)は含まれない
  - name: dashboard
    description: ダッシュボードテンプレート(管理は admin，選択は全ユーザー)
  - name: schema
    description: SQL Server カタログの参照(テーブル登録用, admin)
  - name: admin
    description: 機能マスタ・ユーザー権限の管理(admin)
  - name: history
    description: 操作履歴(admin)

paths:
  # ---- 認証
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: LDAP(AD) 認証してセッション cookie を発行
      description: |
        search-then-bind で認証する。成功時:
        1. objectGUID を正規化して `ftool_app_users` へ UPSERT(初回は自動登録)
        2. Valkey にセッションを作成し，セッションID を httpOnly cookie `sid` で発行
        3. 呼び出しユーザーの機能権限つきで `Me` を返す
      security: []          # このエンドポイントのみ未認証で呼べる
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功。Set-Cookie でセッションを発行。
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sid=xxxxx; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 資格情報が不正(ユーザー不存在・パスワード誤りを区別しない)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: LDAP サーバーに到達できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: セッションストア(Valkey)が利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: セッションを破棄する
      description: Valkey のセッションを削除し，cookie を Max-Age=0 で上書きする。
      responses:
        '204':
          description: ログアウト完了
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 現在のユーザーと機能権限を返す
      description: |
        フロントの起動時に呼び，ログイン状態を判定する。
        `actions` はダッシュボードのカード描画にそのまま使える
        (enabled な機能のみ，sort_order 順)。
      responses:
        '200':
          description: ログイン中のユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- 個人ダッシュボード(実体化コピー方式。2026-07-22 決定)
  # 旧 /me/links(個人カード)+ /me/dashboard(選択テンプレート+並び順+
  # 非表示キー)は本エンドポイント1本に統合された。ユーザーの「現在の
  # ダッシュボード」そのものを表す項目配列を全置換で保存する。
  /me/dash-items:
    get:
      tags: [dashboard]
      operationId: getMyDashItems
      summary: 自分のダッシュボード項目一覧(position 順)
      description: |
        0件 = 未カスタマイズ(フロントは権限のある全機能を既定表示にフォールバック)。
        1件以上 = 実体化済み。権限の無い action/table 項目は描画時にフロントが
        除外する(削除はしない。権限が戻れば再表示される)。
      responses:
        '200':
          description: ダッシュボード項目一覧
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDashItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [dashboard]
      operationId: setMyDashItems
      summary: 自分のダッシュボード項目を全置換
      description: |
        配列順 = position。テンプレート適用・並べ替え・カード追加/削除の
        いずれもこの全置換で実装する(部分更新 API は無い)。空配列 = 既定
        表示に戻す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserDashItemInput'
      responses:
        '200':
          description: 更新後の項目一覧
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDashItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- ダッシュボードテンプレート
  /dash-templates:
    get:
      tags: [dashboard]
      operationId: listDashTemplates
      summary: ダッシュボードテンプレートの一覧
      description: 認証のみで参照可(enabled のみ)。`all=true` は settings:admin 専用で全件。
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: テンプレート一覧(items なし)
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/DashTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [dashboard]
      operationId: createDashTemplate
      summary: テンプレートを作成 (settings:admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashTemplateCreate'
      responses:
        '201':
          description: 作成したテンプレート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: name が重複している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dash-templates/{id}:
    get:
      tags: [dashboard]
      operationId: getDashTemplate
      summary: テンプレート詳細(items 込み)
      description: 認証のみで参照可(選択したテンプレートの描画に使う)。
      parameters:
        - $ref: '#/components/parameters/DashTemplateId'
      responses:
        '200':
          description: テンプレート(items 込み)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [dashboard]
      operationId: updateDashTemplate
      summary: テンプレートを変更 (settings:admin)
      parameters:
        - $ref: '#/components/parameters/DashTemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashTemplateUpdate'
      responses:
        '200':
          description: 更新後のテンプレート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: name が重複している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [dashboard]
      operationId: deleteDashTemplate
      summary: テンプレートを削除 (settings:admin)
      description: |
        実体化コピー方式のため，適用済みユーザーの ftool_app_user_dash_items
        には影響しない(コピーは独立して残る)。
      parameters:
        - $ref: '#/components/parameters/DashTemplateId'
      responses:
        '204':
          description: 削除完了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dash-templates/{id}/items:
    put:
      tags: [dashboard]
      operationId: setDashTemplateItems
      summary: テンプレート項目を一括置換 (settings:admin)
      description: 配列の順序がそのまま position になる。
      parameters:
        - $ref: '#/components/parameters/DashTemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/DashTemplateItemInput'
      responses:
        '200':
          description: 更新後のテンプレート(items 込み)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---- 管理対象テーブル
  /managed-tables:
    get:
      tags: [tables]
      operationId: listManagedTables
      summary: 管理対象テーブルの一覧
      description: |
        enabled な管理対象テーブルを sort_order 順で返す。
        `all=true` は settings:admin 専用で，disabled も含めた全件を返す
        (設定画面用)。
      parameters:
        - name: all
          in: query
          description: disabled も含める(settings:admin のみ)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: テーブル一覧
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [tables]
      operationId: createManagedTable
      summary: テーブルを管理対象として登録 (settings:admin)
      description: |
        指定の schema.table を SQL Server カタログと突合して検証する:
        - 実在する BASE TABLE であること
        - 主キーを持つこと(無いテーブルは登録不可)
        - `ftool_app_` 接頭辞(本ツール自身のテーブル)でないこと
        検証に通れば `ftool_app_managed_tables` へ登録し，登録時点の PK を
        スナップショットとして保存する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedTableCreate'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedTable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 指定の schema.table が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 既に登録済み，または主キーが無い等で登録できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /managed-tables/{id}:
    patch:
      tags: [tables]
      operationId: updateManagedTable
      summary: 管理対象テーブルの表示名などを変更 (settings:admin)
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedTableUpdate'
      responses:
        '200':
          description: 更新後のテーブル
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedTable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tables]
      operationId: deleteManagedTable
      summary: 管理対象から外す (settings:admin)
      description: |
        `ftool_app_managed_tables` から行を削除する。対象の業務テーブル自体は
        削除されない。操作は履歴に残る。
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
      responses:
        '204':
          description: 削除完了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managed-tables/{id}/meta:
    get:
      tags: [tables]
      operationId: getTableMeta
      summary: テーブルの列定義(フロントの動的描画用)
      description: |
        SQL Server カタログ(INFORMATION_SCHEMA / sys.columns)から実行時に
        取得した列定義を返す。IDENTITY・計算列・rowversion は readonly。
        対応外の型(varbinary 等)は string + readonly に落とす。
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
      responses:
        '200':
          description: 列定義と自ユーザーの操作可否
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managed-tables/{id}/rows:
    get:
      tags: [tables]
      operationId: listRows
      summary: 行データの取得(ページネーション)
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
        - name: limit
          in: query
          description: 1回のフェッチ件数(1〜1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: q
          in: query
          description: 簡易検索。文字列型の列を対象に LIKE 検索する。
          schema:
            type: string
        - name: filters
          in: query
          description: |
            列ごとのフィルタ(JSON オブジェクト: 列名→値)。q と AND 結合。
            型別の意味: string=部分一致 / int・decimal=一致 / bool=一致(true/false) /
            date・datetime=その日付に一致 / uuid=一致。
            列名は実在する列のみ許可(不正な列名は 400)。
          schema:
            type: string
          example: '{"code":"A-","stock":"500"}'
        - $ref: '#/components/parameters/Preds'
        - name: orderBy
          in: query
          description: ソート列。実在する列名のみ許可(SQLインジェクション防止)。
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: 行データ。`total` は検索条件適用後の総件数。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managed-tables/{id}/rows/export:
    get:
      tags: [tables]
      operationId: exportRows
      summary: 行データを CSV でエクスポート (table-maint:user+)
      description: |
        現在の列フィルタ条件に一致する**全行**を CSV(UTF-8，ヘッダー行 = 列名)で
        ストリーム出力する。`$rowVersion` は含まない。NULL は空文字，bool は
        true/false，日付は ISO 8601。BOM は付けない(Excel 互換が必要な場合は
        クライアント側で前置する)。エクスポートは操作履歴に記録される。
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
        - name: filters
          in: query
          description: 列ごとのフィルタ(listRows と同じ JSON オブジェクト文字列)
          schema:
            type: string
        - $ref: '#/components/parameters/Preds'
      responses:
        '200':
          description: CSV 本文
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managed-tables/{id}/rows/batch:
    post:
      tags: [tables]
      operationId: applyBatch
      summary: 追加・更新・削除を1トランザクションで一括反映 (table-maint:maintainer+)
      description: |
        フロントの編集バッファの差分をまとめて受け取り，**単一トランザクション**
        で適用する。1件でも失敗すれば全体をロールバックし 409 を返す(部分成功なし)。

        楽観ロック: rowversion 列を持つテーブルでは updates/deletes に取得時の
        `rowVersion` が必須。不一致なら 409 conflict。rowversion の無いテーブル
        は主キーのみで更新する(last-write-wins)。
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: 全件反映成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            制約違反・楽観ロック不一致などで全体ロールバックした。
            `details` にどの操作が原因かを含める。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchError'

  # ---- 接続
  /connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: 接続の一覧 (settings:admin)
      description: パスワードは決して返さない。
      responses:
        '200':
          description: 接続一覧
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [connections]
      operationId: createConnection
      summary: 接続を登録 (settings:admin)
      description: パスワードは AES-GCM で暗号化して保存する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '201':
          description: 登録した接続
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: name が重複している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /connections/{id}:
    patch:
      tags: [connections]
      operationId: updateConnection
      summary: 接続を変更 (settings:admin)
      description: password を省略した場合は変更しない。
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdate'
      responses:
        '200':
          description: 更新後の接続
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: name が重複している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: 接続を削除 (settings:admin)
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '204':
          description: 削除完了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 管理対象テーブルがこの接続を参照している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /connections/{id}/test:
    post:
      tags: [connections]
      operationId: testConnection
      summary: 保存済み接続の疎通テスト (settings:admin)
      description: 失敗も 200 で返す(ok=false + message)。UI 表示用。
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: テスト結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /connections/test:
    post:
      tags: [connections]
      operationId: testConnectionParams
      summary: 保存前の疎通テスト (settings:admin)
      description: 登録ダイアログの[接続テスト]用。パスワードを含む生パラメータで試す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '200':
          description: テスト結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---- スキーマ候補
  /schema/tables:
    get:
      tags: [schema]
      operationId: listSchemaTables
      summary: 登録候補テーブルの一覧 (settings:admin)
      description: |
        指定接続(省略時は既定接続)の SQL Server カタログから BASE TABLE を
        列挙する。本ツール自身のテーブル(`ftool_app_%`)と，その接続スコープで
        登録済みのテーブルは除外する。登録ダイアログ用。
      parameters:
        - name: connectionId
          in: query
          description: 接続ID(省略 = 既定接続)
          schema:
            type: integer
        - name: schema
          in: query
          description: スキーマ名で絞り込み
          schema:
            type: string
      responses:
        '200':
          description: 候補テーブル一覧
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchemaTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /schema/tables/{schema}/{table}/columns:
    get:
      tags: [schema]
      operationId: previewSchemaTable
      summary: 登録前のカラムプレビュー (settings:admin)
      description: 登録ダイアログで列定義と PK を確認するためのプレビュー。
      parameters:
        - name: connectionId
          in: query
          description: 接続ID(省略 = 既定接続)
          schema:
            type: integer
        - name: schema
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - name: table
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: 列定義プレビュー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaTablePreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---- ユーザー・機能管理
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: ユーザー一覧と機能権限 (settings:admin)
      parameters:
        - name: q
          in: query
          description: username / display_name の部分一致検索
          schema:
            type: string
        - name: limit
          in: query
          description: 1回のフェッチ件数(1〜1000)。省略時は上限まで返す。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/Preds'
      responses:
        '200':
          description: ユーザー一覧。`total` は検索条件適用後の総件数。
          content:
            application/json:
              schema:
                type: object
                required: [users, total, limit, offset]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWithAuth'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{objectGuid}/auth:
    put:
      tags: [admin]
      operationId: setUserAuth
      summary: ユーザーの機能権限を一括置換 (settings:admin)
      description: |
        指定ユーザーの `ftool_app_user_auth` を body の内容で置き換える
        (含まれない機能の行は削除 = 権限なし)。
        自分自身から settings:admin を外すことはできない(409)。
      parameters:
        - name: objectGuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    $ref: '#/components/schemas/AuthAssignment'
      responses:
        '200':
          description: 更新後のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithAuth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 自分自身の settings:admin を外そうとした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/actions:
    get:
      tags: [admin]
      operationId: listActions
      summary: 機能マスタの全件一覧 (settings:admin)
      description: |
        disabled も含む全件。設定画面のダッシュボード編集用。
        機能(行)の追加・削除はコード実装 + シードとセットで行うため API には無い
        (全行が常に組込のため削除 API も提供しない)。
        任意 URL のリンクカードは /me/dash-items(kind=link)を参照。
      responses:
        '200':
          description: 機能一覧
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Action'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/actions/{id}:
    patch:
      tags: [admin]
      operationId: updateAction
      summary: 機能を変更 (settings:admin)
      description: code は変更不可(ルーティングと対応するため)。
      parameters:
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionUpdate'
      responses:
        '200':
          description: 更新後の機能
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---- 操作履歴
  /history:
    get:
      tags: [history]
      operationId: listHistory
      summary: 操作履歴の検索 (history:maintainer+)
      parameters:
        - name: username
          in: query
          schema:
            type: string
        - name: actionCode
          in: query
          schema:
            type: string
        - name: target
          in: query
          description: 対象(例 dbo.products)の部分一致
          schema:
            type: string
        - name: operation
          in: query
          description: 操作(例 rows.batch)の部分一致
          schema:
            type: string
        - name: clientIp
          in: query
          description: クライアント IP の部分一致
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: from
          in: query
          description: この日時以降(ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: この日時以前(ISO 8601)
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/Preds'
      responses:
        '200':
          description: 履歴(occurred_at 降順)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /history/export:
    get:
      tags: [history]
      operationId: exportHistory
      summary: 操作履歴を CSV でエクスポート (history:maintainer+)
      description: |
        listHistory と同じフィルタ条件に一致する**全行**を CSV(UTF-8，ヘッダー行つき)
        でストリーム出力する。日時列は JST 表記(列名 occurred_at_jst)。summary 列は
        detail の人間可読要約(日本語)，detail は JSON 文字列のまま 1 セルに入れる。
        BOM は付けない(Excel 互換が必要な場合はクライアント側で前置する)。
        エクスポート自体も操作履歴に記録される。
      parameters:
        - name: username
          in: query
          schema:
            type: string
        - name: actionCode
          in: query
          schema:
            type: string
        - name: target
          in: query
          schema:
            type: string
        - name: operation
          in: query
          schema:
            type: string
        - name: clientIp
          in: query
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Preds'
      responses:
        '200':
          description: CSV 本文
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /history/{id}/overflow:
    get:
      tags: [history]
      operationId: getHistoryOverflow
      summary: detail が 1MB を超えて退避された全文を取得 (history:maintainer+)
      description: |
        detail が `{"truncated":true,"overflowKey":"..."}` の場合のみ有効。
        backend がオブジェクトストレージ(MinIO)からサーバーサイドで取得して返す
        (ブラウザに直接ストレージを触らせない)。overflow 機能が無効な環境
        (MINIO_ENDPOINT 未設定)や，該当行に overflowKey が無い場合は 404。
      parameters:
        - name: id
          in: path
          required: true
          description: ftool_app_operation_history.id
          schema:
            type: integer
      responses:
        '200':
          description: 全文の JSON(元の detail をそのまま返す)
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: セッションID を格納した httpOnly cookie

  parameters:
    ManagedTableId:
      name: id
      in: path
      required: true
      description: ftool_app_managed_tables.id
      schema:
        type: integer
      example: 1
    Preds:
      name: preds
      in: query
      description: |
        チップフィルタの述語配列(JSON 配列文字列)。各要素は
        {column, op, values[], negate?}。op: eq / contains / gt / gte / lt / lte / range。
        述語間は AND,同一述語内の複数 values は OR(eq/contains のみ)。
        negate=true で条件を否定(NULL 行は「一致しない」側に含める)。
        日付値は YYYY-MM-DD(eq はその日1日,range は日単位で両端含む)。
        列は各エンドポイントの許可リスト外なら 400。他のフィルタ(q/filters 等)
        と併用時は AND 結合。
      schema:
        type: string
      example: '[{"column":"val","op":"gt","values":["10"]},{"column":"code","op":"contains","values":["A-","B-"],"negate":true}]'
    ConnectionId:
      name: id
      in: path
      required: true
      description: ftool_app_connections.id
      schema:
        type: integer
      example: 1
    DashTemplateId:
      name: id
      in: path
      required: true
      description: ftool_app_dash_templates.id
      schema:
        type: integer
      example: 1
    ActionId:
      name: id
      in: path
      required: true
      description: ftool_app_actions.id
      schema:
        type: integer
      example: 1

  responses:
    Unauthorized:
      description: 未ログインまたはセッション失効
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 権限不足(必要な機能・レベルを満たさない)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: リソースが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: バリデーションエラー(不正な列名・型不一致など)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ---- 共通
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 機械可読なエラーコード
          enum:
            - invalid_credentials
            - unauthorized
            - forbidden
            - not_found
            - validation_failed
            - conflict
            - ldap_unavailable
            - session_unavailable
            - connection_unavailable
            - internal
        message:
          type: string
          description: 人間向けメッセージ(日本語)
        details:
          type: object
          additionalProperties: true
          description: エラー種別ごとの補足情報

    AuthLevel:
      type: string
      enum: [admin, maintainer, user]
      description: 機能ごとの権限レベル。admin > maintainer > user。

    # ---- 認証
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: sAMAccountName (開発 OpenLDAP では uid)
          example: yamada.taro
        password:
          type: string
          format: password
          minLength: 1

    Me:
      type: object
      required: [username, displayName, actions]
      properties:
        username:
          type: string
          example: yamada.taro
        displayName:
          type: string
          example: 山田 太郎
        email:
          type: string
          example: yamada.taro@example.co.jp
        actions:
          type: array
          description: 権限を持つ機能(enabled のみ, sort_order 順)。ダッシュボードのカード描画に使う。
          items:
            $ref: '#/components/schemas/GrantedAction'

    GrantedAction:
      type: object
      required: [id, code, name, icon, authLevel]
      properties:
        id:
          type: integer
        code:
          type: string
          example: table-maint
        name:
          type: string
          example: テーブルメンテナンス
        icon:
          type: string
          description: Material Symbols 名
          example: table
        authLevel:
          $ref: '#/components/schemas/AuthLevel'

    # ---- 接続
    Connection:
      type: object
      description: 接続先 SQL Server。パスワードは API に決して現れない。
      required: [id, name, host, port, databaseName, username, enabled]
      properties:
        id:
          type: integer
        name:
          type: string
          description: 表示名(履歴の target のプレフィックスにも使う)
          example: 生産管理DB
        host:
          type: string
          example: db2.example.local
        port:
          type: integer
          example: 1433
        databaseName:
          type: string
          example: seisan
        username:
          type: string
          example: svc_ftool
        options:
          type: string
          description: 追加 DSN パラメータ(例 encrypt=disable)
        schemaName:
          type: string
          description: >-
            スキーマ制限。空/未設定 = 制限なし(全スキーマ)。
            設定時はこの接続でそのスキーマのテーブルだけ登録・閲覧できる。
        enabled:
          type: boolean

    ConnectionCreate:
      type: object
      required: [name, host, databaseName, username, password]
      properties:
        name:
          type: string
          maxLength: 128
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          default: 1433
        databaseName:
          type: string
          maxLength: 128
        username:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 1
        options:
          type: string
          maxLength: 256
        schemaName:
          type: string
          maxLength: 128
          description: スキーマ制限(空=制限なし)。この接続はこのスキーマ限定になる。
        enabled:
          type: boolean
          default: true

    ConnectionUpdate:
      type: object
      description: 指定したフィールドだけ更新する(部分更新)。password 省略 = 変更なし。
      properties:
        name:
          type: string
          maxLength: 128
        host:
          type: string
          maxLength: 255
        port:
          type: integer
        databaseName:
          type: string
          maxLength: 128
        username:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
        options:
          type: string
          maxLength: 256
        schemaName:
          type: string
          maxLength: 128
        enabled:
          type: boolean

    ConnectionTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: 失敗時の理由(人間向け)
        latencyMs:
          type: integer

    # ---- 個人ダッシュボード(実体化コピー方式)
    UserDashItem:
      type: object
      description: |
        ユーザー個人の「現在のダッシュボード」を構成する項目(position 順)。
        kind=action は機能カード，kind=link は任意 URL カード，kind=table は
        管理対象テーブルへのショートカット。ftool_app_dash_template_items と
        同じ形だが，テンプレートへの参照は持たない(コピーのため独立)。
      required: [id, position, kind]
      properties:
        id:
          type: integer
        position:
          type: integer
        kind:
          type: string
          enum: [action, link, table]
        actionId:
          type: integer
          description: kind=action のとき対象機能の id
        actionCode:
          type: string
          description: kind=action のとき対象機能の code(表示解決・遷移用)
        managedTableId:
          type: integer
          description: kind=table のとき対象の管理対象テーブル id
        managedTableName:
          type: string
          description: kind=table のとき対象テーブルの表示名(参照専用)
        name:
          type: string
          description: kind=link のときのタイトル
        url:
          type: string
          description: kind=link のときの URL
        icon:
          type: string
          description: kind=link のときのアイコン

    UserDashItemInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [action, link, table]
        actionId:
          type: integer
          description: kind=action で必須。権限を持つ enabled な機能の id。
        managedTableId:
          type: integer
          description: kind=table で必須。enabled な管理対象テーブルの id。
        name:
          type: string
          maxLength: 128
          description: kind=link で必須
        url:
          type: string
          maxLength: 512
          description: kind=link で必須(http(s))
        icon:
          type: string
          maxLength: 64
          default: open_in_new

    DashTemplate:
      type: object
      required: [id, name, enabled]
      properties:
        id:
          type: integer
        name:
          type: string
          example: 製造部門標準
        description:
          type: string
        enabled:
          type: boolean
        personal:
          type: boolean
          default: false
          description: true = 本人だけがアクセスできる個人テンプレート(false = 管理者配布)
        items:
          type: array
          description: 詳細取得(GET /dash-templates/{id})と items PUT の応答にのみ含まれる
          items:
            $ref: '#/components/schemas/DashTemplateItem'

    DashTemplateItem:
      type: object
      required: [id, position, kind]
      properties:
        id:
          type: integer
        position:
          type: integer
        kind:
          type: string
          enum: [action, link, table]
        actionId:
          type: integer
          description: kind=action のとき対象機能の id
        actionCode:
          type: string
          description: kind=action のとき対象機能の code(表示解決用)
        managedTableId:
          type: integer
          description: kind=table のとき対象の管理対象テーブル id
        managedTableName:
          type: string
          description: kind=table のとき対象テーブルの表示名(参照専用)
        name:
          type: string
          description: kind=link のときのタイトル
        url:
          type: string
          description: kind=link のときの URL
        icon:
          type: string
          description: kind=link のときのアイコン

    DashTemplateItemInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [action, link, table]
        actionId:
          type: integer
          description: kind=action で必須
        managedTableId:
          type: integer
          description: kind=table で必須。enabled な管理対象テーブルの id。
        name:
          type: string
          maxLength: 128
          description: kind=link で必須
        url:
          type: string
          maxLength: 512
          description: kind=link で必須(http(s))
        icon:
          type: string
          maxLength: 64
          default: open_in_new

    DashTemplateCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 400
        enabled:
          type: boolean
          default: true
        personal:
          type: boolean
          default: false
          description: |
            true = 呼び出しユーザー所有の個人テンプレートとして作成
            (settings:admin 不要。本人しか参照・変更・削除できない)。
            false(既定)= 管理者配布(settings:admin 必須)。

    DashTemplateUpdate:
      type: object
      description: 指定したフィールドだけ更新する(部分更新)。
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 400
        enabled:
          type: boolean

    # ---- 管理対象テーブル
    ManagedTable:
      type: object
      required: [id, schemaName, tableName, displayName, sortOrder, enabled, writable]
      properties:
        id:
          type: integer
        connectionId:
          type: integer
          nullable: true
          description: null = 既定接続(アプリ自身のDB)
        connectionName:
          type: string
          nullable: true
          description: 接続の表示名(既定接続は null)
        schemaName:
          type: string
          example: dbo
        tableName:
          type: string
          example: products
        displayName:
          type: string
          example: 商品マスタ
        description:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
        writable:
          type: boolean
          description: 呼び出しユーザーが編集可能か(table-maint:maintainer+)
        readonlyColumns:
          type: array
          items:
            type: string
          description: 登録時に編集不可へ指定した列名(IDENTITY 等の自動判定分は含まない)
        hiddenColumns:
          type: array
          items:
            type: string
          description: 管理対象外(除外)に指定した列名。SELECT 自体から除外される。
        fixedColumns:
          type: array
          items:
            $ref: '#/components/schemas/FixedColumn'
          description: 保存時にサーバーが自動セットする固定値列。

    FixedColumn:
      type: object
      required: [name, kind, applyOn]
      description: |
        固定値列の指定。対象列はユーザー編集不可になり，行の追加/更新時に
        サーバーが値を自動セットする(クライアントから送られた値は無視)。
      properties:
        name:
          type: string
          description: 対象列名
        kind:
          type: string
          enum: [literal, now]
          description: literal = 固定文字列 / now = 保存時のサーバー現在時刻(UTC)
        value:
          type: string
          maxLength: 400
          description: kind=literal のときにセットする値
        applyOn:
          type: string
          enum: [insert, update, both]
          description: 適用タイミング(行の追加時のみ / 更新時のみ / 両方)

    ManagedTableCreate:
      type: object
      required: [schemaName, tableName, displayName]
      properties:
        connectionId:
          type: integer
          nullable: true
          description: 省略/null = 既定接続
        schemaName:
          type: string
          maxLength: 128
          example: dbo
        tableName:
          type: string
          maxLength: 128
          example: products
        displayName:
          type: string
          maxLength: 128
          example: 商品マスタ
        description:
          type: string
          maxLength: 400
        sortOrder:
          type: integer
          default: 0
        readonlyColumns:
          type: array
          items:
            type: string
          description: 編集不可にする列名。主キー列は指定不可。
        hiddenColumns:
          type: array
          items:
            type: string
          description: |
            管理対象外(除外)にする列名。主キー列は指定不可。
            除外列は SELECT・編集・CSV・履歴のいずれにも現れない
            (個人情報を含む列を構造的に遮断する用途)。
        fixedColumns:
          type: array
          items:
            $ref: '#/components/schemas/FixedColumn'
          description: 固定値列。主キー列・除外列との重複指定は不可。

    ManagedTableUpdate:
      type: object
      description: 指定したフィールドだけ更新する(部分更新)。
      properties:
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 400
        sortOrder:
          type: integer
        enabled:
          type: boolean
        readonlyColumns:
          type: array
          items:
            type: string
          description: 編集不可にする列名(全置換。省略時は変更しない)
        hiddenColumns:
          type: array
          items:
            type: string
          description: 管理対象外(除外)にする列名(全置換。省略時は変更しない)
        fixedColumns:
          type: array
          items:
            $ref: '#/components/schemas/FixedColumn'
          description: 固定値列(全置換。省略時は変更しない)

    TableMeta:
      type: object
      required: [id, displayName, primaryKey, writable, hasRowVersion, columns]
      properties:
        id:
          type: integer
          description: ftool_app_managed_tables.id
        connectionId:
          type: integer
          nullable: true
          description: null = 既定接続
        connectionName:
          type: string
          nullable: true
        schemaName:
          type: string
        tableName:
          type: string
        displayName:
          type: string
        primaryKey:
          type: array
          description: 複合主キー対応のため配列
          items:
            type: string
          example: [id]
        writable:
          type: boolean
        hasRowVersion:
          type: boolean
          description: rowversion 列を持ち楽観ロック可能か
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMeta'
        insertBlockedColumns:
          type: array
          items:
            type: string
          description: |
            除外(hidden)指定された NOT NULL・デフォルトなし列。
            1つでもあると INSERT が必ず失敗するため，UI は新規作成・CSV 取込を
            無効化する(batch も事前に validation エラーで拒否する)。

    ColumnMeta:
      type: object
      required: [name, type, nullable, readonly]
      properties:
        name:
          type: string
          example: price
        type:
          type: string
          description: |
            フロントの入力コントロール選択に使う正規化済み型。
            対応外の SQL 型は string + readonly に落とす。
          enum: [string, int, decimal, bool, date, datetime, uuid]
        nullable:
          type: boolean
        readonly:
          type: boolean
          description: |
            IDENTITY 列・計算列・rowversion・対応外型，または登録時に
            編集不可へ指定した列。true なら編集UI無効。
        required:
          type: boolean
          default: false
          description: NOT NULL かつデフォルト値なし(insert 時に必須)
        maxLength:
          type: integer
          description: string 型のときの最大長(nvarchar(n) 由来。MAX は省略)
        searchable:
          type: boolean
          default: false
          description: q パラメータの検索対象か(文字列型の列)
        fixed:
          type: boolean
          default: false
          description: |
            固定値列(保存時にサーバーが自動セット)。true なら readonly も true。
            UI は「自動設定」バッジを表示し入力を無効化する。

    Row:
      type: object
      additionalProperties: true
      description: |
        列名→値のマップ。値の型は ColumnMeta.type に従う。
        date/datetime は ISO 8601 文字列，uuid は正規化済み文字列。

    RowPage:
      type: object
      required: [rows, total, limit, offset]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/Row'
        total:
          type: integer
          description: 検索条件適用後の総件数(正確な COUNT。2026-07-23 にカップ廃止)
        limit:
          type: integer
        offset:
          type: integer

    # ---- バッチ
    PrimaryKey:
      type: object
      additionalProperties: true
      description: |
        主キー列名→値のマップ。単一キーなら {"id": 1}，
        複合キーなら {"order_id": 1, "line_no": 2} の形。
      example: { id: 42 }

    BatchRequest:
      type: object
      properties:
        inserts:
          type: array
          items:
            $ref: '#/components/schemas/Row'
          description: readonly 列を含めてはならない(400)
        updates:
          type: array
          items:
            type: object
            required: [key, changes]
            properties:
              key:
                $ref: '#/components/schemas/PrimaryKey'
              changes:
                $ref: '#/components/schemas/Row'
              rowVersion:
                type: string
                description: base64。hasRowVersion のテーブルでは必須。
        deletes:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                $ref: '#/components/schemas/PrimaryKey'
              rowVersion:
                type: string
      example:
        inserts:
          - { code: "D-4001", name: "モニター 27インチ", price: 29800, stock: 10 }
        updates:
          - key: { id: 42 }
            changes: { price: 1980 }
            rowVersion: "AAAAAAAAB9E="
        deletes:
          - key: { id: 7 }
            rowVersion: "AAAAAAAAB9I="

    BatchResult:
      type: object
      required: [inserted, updated, deleted]
      properties:
        inserted:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        insertedKeys:
          type: array
          items:
            $ref: '#/components/schemas/PrimaryKey'
          description: IDENTITY 採番された主キーの返却(フロントのバッファ更新用)

    BatchError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            details:
              type: object
              properties:
                operation:
                  type: string
                  enum: [insert, update, delete]
                index:
                  type: integer
                  description: リクエスト配列内の位置(0始まり)
                reason:
                  type: string
                  enum: [constraint_violation, row_version_mismatch, not_found, validation]

    # ---- スキーマ候補
    SchemaTable:
      type: object
      required: [schemaName, tableName, hasPrimaryKey]
      properties:
        schemaName:
          type: string
          example: dbo
        tableName:
          type: string
          example: orders
        hasPrimaryKey:
          type: boolean
          description: false のテーブルは登録できない(UI 側でグレーアウト)

    SchemaTablePreview:
      type: object
      required: [schemaName, tableName, primaryKey, hasRowVersion, columns]
      properties:
        schemaName:
          type: string
        tableName:
          type: string
        primaryKey:
          type: array
          items:
            type: string
        hasRowVersion:
          type: boolean
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMeta'

    # ---- ユーザー・機能管理
    Action:
      type: object
      required: [id, code, name, icon, sortOrder, enabled]
      properties:
        id:
          type: integer
        code:
          type: string
          example: table-maint
        name:
          type: string
          example: テーブルメンテナンス
        icon:
          type: string
          example: table
        sortOrder:
          type: integer
        enabled:
          type: boolean

    ActionUpdate:
      type: object
      description: |
        指定したフィールドだけ更新する(部分更新)。code は変更不可。
        settings 機能の enabled は変更不可(ロックアウト防止で 409)。
      properties:
        name:
          type: string
          maxLength: 128
        icon:
          type: string
          maxLength: 64
        sortOrder:
          type: integer
        enabled:
          type: boolean

    UserWithAuth:
      type: object
      required: [objectGuid, username, displayName, auth]
      properties:
        objectGuid:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        lastLoginAt:
          type: string
          format: date-time
        auth:
          type: array
          items:
            $ref: '#/components/schemas/UserAuthEntry'

    UserAuthEntry:
      type: object
      required: [actionId, actionCode, authLevel]
      properties:
        actionId:
          type: integer
        actionCode:
          type: string
        authLevel:
          $ref: '#/components/schemas/AuthLevel'

    AuthAssignment:
      type: object
      required: [actionId, authLevel]
      properties:
        actionId:
          type: integer
        authLevel:
          $ref: '#/components/schemas/AuthLevel'

    # ---- 操作履歴
    HistoryEntry:
      type: object
      required: [id, occurredAt, username, actionCode, operation, result]
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        objectGuid:
          type: string
          format: uuid
        username:
          type: string
        actionCode:
          type: string
          example: table-maint
        operation:
          type: string
          example: rows.batch
        target:
          type: string
          example: dbo.products
        detail:
          type: object
          additionalProperties: true
          description: 変更前後・件数などの JSON
        result:
          type: string
          enum: [success, failure]
        errorCode:
          type: string
        clientIp:
          type: string

    HistoryPage:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

security:
  - cookieAuth: []
