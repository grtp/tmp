# 商品マスタ
# name(=API上の識別子)はこのファイル名(products.yaml → products)と一致させる。
schema: dbo
table: products
displayName: 商品マスタ
description: 販売商品の基本情報。

primaryKey: [id]

# rowversion 列を指定すると、この列を使った楽観ロックが有効になる。
# (updates/deletes に rowVersion 必須、SELECT にも自動で含まれる)
rowVersionColumn: row_ver

permissions:
  read:  [user, maintainer, admin]
  write: [maintainer, admin]

columns:
  - name: id
    displayName: ID
    type: int
    readonly: true        # IDENTITY 列。INSERT/UPDATE の対象外。
    # nullable は省略時 false

  - name: code
    displayName: 商品コード
    type: string
    required: true
    maxLength: 20
    searchable: true

  - name: name
    displayName: 商品名
    type: string
    required: true
    maxLength: 100
    searchable: true

  - name: category
    displayName: カテゴリ
    type: string
    maxLength: 50
    nullable: true

  - name: price
    displayName: 単価
    type: decimal
    required: true
    min: 0

  - name: stock
    displayName: 在庫数
    type: int
    required: true
    min: 0

  - name: updated_at
    displayName: 更新日時
    type: datetime
    readonly: true        # DEFAULT SYSUTCDATETIME() + トリガー等でDB側が管理
