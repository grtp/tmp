# deploy/compose.yaml
# 本番(MIRACLE LINUX 9.6 / podman): nginx + backend の2コンテナ。
# SQL Server と AD は既存の社内サーバーを使う(コンテナ化しない)。
#
#   podman compose -f deploy/compose.yaml up -d --build
#
# 事前に .env(このファイルと同じディレクトリ)へ本番値を書く:
#   MSSQL_DSN=sqlserver://svc_tablemaint:***@db.example.local:1433?database=tablemaint
#   LDAP_URL=ldaps://dc.example.local:636
#   LDAP_BASE_DN=DC=example,DC=local
#   LDAP_BIND_DN=CN=svc-ldap,OU=Service,DC=example,DC=local
#   LDAP_BIND_PASSWORD=***
#   JWT_SECRET=(十分長いランダム値: openssl rand -base64 48)
#   COOKIE_SECURE=true   # HTTPS 終端がある場合

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: tm-backend
    environment:
      ADDR: ":8080"
      MSSQL_DSN: ${MSSQL_DSN}
      LDAP_URL: ${LDAP_URL}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(sAMAccountName=%s)}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    image: docker.io/library/nginx:1.27-alpine
    container_name: tm-frontend
    ports:
      - "80:80"
    volumes:
      # ng build 済みの成果物を配置しておく:
      #   cd frontend && npm run build
      #   -> dist/frontend/browser がここにマウントされる
      - ../frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
