# deploy/nginx/default.conf
# 同一オリジン構成: ブラウザは :80 とだけ通信し，/api/* を backend へ
# 転送する。これにより本番では CORS が不要になる。
server {
    listen 80;
    server_name _;

    # CSV 一括取込は行データを JSON で送るため既定の 1MB では足りない。
    # 前段に別の nginx を置く場合は そちらにも同じ値を書くこと
    # (外側の上限が先に効くため，内側だけ広げても 413 になる)。
    client_max_body_size 32m;

    root  /usr/share/nginx/html;
    index index.html;

    # API はバックエンドへ
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 前段(ホスト nginx)が実クライアント IP を確定させている前提で追記する。
        # このコンテナを LAN へ直接出す場合(FRONTEND_BIND=0.0.0.0)は，
        # ここが信頼境界になるので $remote_addr へ変えること
        # (でないとクライアントが操作履歴の client_ip を詐称できる)。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CSV 出力はサーバー側でストリーミングする。既定の 60 秒では
        # 大きなテーブルで切れるため延ばし，バッファリングも切って
        # ダウンロードがすぐ始まるようにする。
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # Angular SPA: 実ファイルがなければ index.html(クライアントルーティング)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ビルド成果物はハッシュ付きファイル名なので長期キャッシュ可
    location ~* \.(?:js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
