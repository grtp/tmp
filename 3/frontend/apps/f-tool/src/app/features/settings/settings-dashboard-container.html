@if (errorMessage(); as msg) {
  <p class="error">{{ msg }}</p>
}

<tm-settings-page
  [activeTab]="tab()"
  [visibleTabs]="visibleTabs()"
  [dashTemplates]="settingsTemplates()"
  [loading]="loading()"
  (tabChanged)="tab.set($event)"
  (templateAddClicked)="openTemplateCreate()"
  (templateEditClicked)="openTemplateEdit($event)"
  (templateToggled)="onTemplateToggled($event)"
  (templateDeleteClicked)="askTemplateDelete($event)"
/>
