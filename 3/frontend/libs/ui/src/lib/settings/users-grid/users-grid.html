<tm-data-table-page
  [selectedTable]="title()"
  [columns]="columnDefs()"
  [rows]="displayRows()"
  [totalCount]="totalCount()"
  [page]="page()"
  [pageSize]="pageSize()"
  [loading]="loading()"
  [canCreate]="false"
  [showMultiSelect]="false"
  [showCsvExport]="false"
  [filterColumns]="filterColumns()"
  [predicates]="predicates()"
  [storageKey]="storageKey()"
  (predicatesChange)="predicatesChange.emit($event)"
  (pageChanged)="pageChanged.emit($event)"
  (pageSizeChanged)="pageSizeChanged.emit($event)"
/>

<!-- ユーザーセル: 表示名 + ユーザーID -->
<ng-template #userTpl let-row>
  <span class="user-name">{{ rowOf(row)?.displayName }}</span>
  <span class="user-id mono"> {{ rowOf(row)?.username }}</span>
</ng-template>

<!-- 権限セル: 通常はテキスト表示で,クリックするとレベル一覧のメニューが開く
     (列は actions から動的生成。col.meta = actionId) -->
<ng-template #levelTpl let-row let-col="col">
  <button
    class="level-btn"
    type="button"
    [class.none]="levelOf(row, col) === ''"
    [class.admin]="levelOf(row, col) === 'admin'"
    [matMenuTriggerFor]="levelMenu"
    (click)="$event.stopPropagation()"
  >
    {{ levelLabel(levelOf(row, col)) }}
    <mat-icon class="ic caret" aria-hidden="true">arrow_drop_down</mat-icon>
  </button>
  <mat-menu #levelMenu="matMenu" class="level-menu">
    @for (lv of LEVELS; track lv) {
      <button mat-menu-item type="button"
        [class.selected]="levelOf(row, col) === lv"
        [class.admin]="lv === 'admin'"
        (click)="onLevelChange(row, col, lv)">
        {{ levelLabel(lv) }}
      </button>
    }
  </mat-menu>
</ng-template>
