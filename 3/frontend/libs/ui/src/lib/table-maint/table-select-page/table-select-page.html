<div class="wrap">
  @if (loading()) {
    <p class="state">{{ 'common.loading' | transloco }}</p>
  } @else {
    <div class="cards">
      @for (t of tables(); track t.id) {
        <button class="card" type="button" (click)="tableSelected.emit(t.id)">
          <span class="card-head">
            <mat-icon class="card-icon ic" aria-hidden="true">table_view</mat-icon>
            @if (t.connectionName) {
              <span class="conn-badge" [title]="t.connectionName">{{ t.connectionName }}</span>
            } @else {
              <span class="conn-badge default" [title]="'common.defaultDb' | transloco">{{ 'common.defaultDb' | transloco }}</span>
            }
          </span>
          <span class="card-name" [title]="t.displayName">{{ t.displayName }}</span>
          <span class="card-table mono" [title]="t.schemaName + '.' + t.tableName">{{ t.schemaName }}.{{ t.tableName }}</span>
          @if (t.description) {
            <span class="card-desc" [title]="t.description">{{ t.description }}</span>
          }
        </button>
      } @empty {
        <p class="empty">{{ 'tableSelect.empty' | transloco }}</p>
      }
    </div>
  }
</div>
