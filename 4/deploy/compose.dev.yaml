# deploy/compose.dev.yaml
# 開発用: SQL Server(+初期化) / OpenLDAP / Redis を立てる。
# backend / frontend は反復速度優先でホスト側で起動する:
#   backend : make run-dev            (LDAP_MOCK=true)
#   backend : make run-dev-ldap       (OpenLDAP 実物で認証)
#   frontend: make fe-serve           (proxy.conf.json で /api -> :8080)
#
# 起動:  podman compose -f deploy/compose.dev.yaml up -d
# 破棄:  podman compose -f deploy/compose.dev.yaml down -v
#
# SELinux が enforcing のホストではバインドマウントに :z が必要(付与済み)。

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tm-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevPassw0rd!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'DevPassw0rd!' -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 初期化はワンショットコンテナで行う(mssql イメージに initdb 機構がないため)。
  # podman-compose は healthcheck condition を無視することがあるため、
  # sqlcmd 成功までリトライするループで自衛する。
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tm-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./initdb:/initdb:ro,z
    entrypoint: /bin/bash
    command:
      - -c
      - |
        for i in $(seq 1 60); do
          /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P 'DevPassw0rd!' -Q 'SELECT 1' -b && break
          echo "waiting for mssql ($i)"; sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P 'DevPassw0rd!' -i /initdb/01_init.sql -b
    restart: "no"

  # 開発用 OpenLDAP。AD の代替なので属性が異なる:
  #   sAMAccountName -> uid / objectGUID -> entryUUID (テキストUUID)
  # backend 側は LDAP_ATTR_* / LDAP_GUID_FORMAT で吸収する。
  # 注意: ボリュームを消すと entryUUID が変わり、付与済み権限と紐付かなくなる。
  ldap:
    # bitnami 本家はタグ配布を終了したため、凍結アーカイブの bitnamilegacy を使う。
    image: docker.io/bitnamilegacy/openldap:2.6
    container_name: tm-ldap
    environment:
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_ROOT: dc=example,dc=local
      LDAP_CUSTOM_LDIF_DIR: /ldifs
    ports:
      - "1389:1389"
    volumes:
      - ./ldap:/ldifs:ro,z
      - ldap-data:/bitnami/openldap

  # セッションストア(TTL 30分スライディング)。
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: tm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mssql-data:
  ldap-data:
