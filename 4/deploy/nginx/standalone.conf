# deploy/nginx/standalone.conf
# 環境A: このコンテナ nginx が唯一の受け口(前段にホスト nginx が居ない)場合の設定。
# .env で NGINX_CONF=standalone.conf / FRONTEND_BIND=0.0.0.0 / FRONTEND_PORT=80
# を指定すると, このファイルがマウントされる。
#
# default.conf との違いは X-Forwarded-For の 1 行だけ:
#   default.conf  … $proxy_add_x_forwarded_for(前段が実 IP を確定済みの前提)
#   standalone.conf … $remote_addr(ここが信頼境界なのでクライアント自称値を捨てる)
# それ以外(SPA フォールバック・キャッシュ・body 上限・タイムアウト)は同一なので,
# 片方を直したらもう片方にも同じ変更を入れること。
server {
    listen 80;
    # IP 直アクセスでもホスト名アクセスでも受ける(_ = 任意にマッチ)。
    server_name _;

    # CSV 一括取込は行データを JSON で送るため既定の 1MB では足りない。
    client_max_body_size 32m;

    root  /usr/share/nginx/html;
    index index.html;

    # API はバックエンドへ
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 【default.conf との唯一の差分】
        # この nginx が LAN と直接接する = ここが信頼境界。クライアントが
        # 自称した X-Forwarded-For は引き継がず $remote_addr で上書きする
        # ($proxy_add_x_forwarded_for だと詐称値が残り, 操作履歴の
        #  client_ip を偽装できてしまう)。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CSV 出力はサーバー側でストリーミングする。既定の 60 秒では
        # 大きなテーブルで切れるため延ばし, バッファリングも切って
        # ダウンロードがすぐ始まるようにする。
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # Angular SPA: 実ファイルがなければ index.html(クライアントルーティング)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ビルド成果物はハッシュ付きファイル名なので長期キャッシュ可
    location ~* \.(?:js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
