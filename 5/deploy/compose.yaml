# deploy/compose.yaml
# 本番(MIRACLE LINUX 9.6 / podman): nginx + backend + redis の3コンテナ。
# SQL Server と AD は既存の社内サーバーを使う(コンテナ化しない)。
#
#   podman compose -f deploy/compose.yaml up -d --build
#
# 事前に .env(このファイルと同じディレクトリ)へ本番値を書く:
#   MSSQL_DSN=sqlserver://svc_tablemaint:***@db.example.local:1433?database=tablemaint
#   LDAP_URL=ldaps://dc.example.local:636
#   LDAP_BASE_DN=DC=example,DC=local
#   LDAP_BIND_DN=CN=svc-ldap,OU=Service,DC=example,DC=local
#   LDAP_BIND_PASSWORD=***
#   COOKIE_SECURE=true   # HTTPS 終端がある場合
#
# rootless podman で :80 が使えない場合は "8081:80" に変えるか
# net.ipv4.ip_unprivileged_port_start を調整する。

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: tm-backend
    environment:
      ADDR: ":8080"
      MSSQL_DSN: ${MSSQL_DSN}
      # --- LDAP (本番 = AD。既定値は AD 向け) ---
      LDAP_URL: ${LDAP_URL}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(sAMAccountName=%s)}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_ATTR_GUID: ${LDAP_ATTR_GUID:-objectGUID}
      LDAP_ATTR_USERNAME: ${LDAP_ATTR_USERNAME:-sAMAccountName}
      LDAP_GUID_FORMAT: ${LDAP_GUID_FORMAT:-ad-binary}
      # --- セッション(Redis) ---
      REDIS_ADDR: redis:6379
      SESSION_TTL_MIN: ${SESSION_TTL_MIN:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_GRANT_TABLE_MAINT_VIEW: ${AUTO_GRANT_TABLE_MAINT_VIEW:-true}
      # 接続先パスワードの暗号鍵(必須): openssl rand -base64 32
      CONN_ENC_KEY: ${CONN_ENC_KEY}
    expose:
      - "8080"
    depends_on:
      - redis
    restart: unless-stopped

  # Valkey (Redis 7.2 フォーク、BSD、RESP 互換)。backend 側は変更不要。
  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: tm-redis
    # セッションのみなので永続化しない(再起動 = 全員再ログイン)
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    restart: unless-stopped

  frontend:
    image: docker.io/library/nginx:1.27-alpine
    container_name: tm-frontend
    ports:
      - "80:80"
    volumes:
      # ビルド済みの成果物を配置しておく:
      #   make fe-build
      #   -> frontend/dist/apps/table-maint/browser がここにマウントされる
      - ../frontend/dist/apps/table-maint/browser:/usr/share/nginx/html:ro,z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - backend
    restart: unless-stopped
