# deploy/compose.yaml
# 本番(MIRACLE LINUX 9.6 / podman): nginx + backend + valkey(redis互換) + minio の4コンテナ。
# SQL Server と AD は既存の社内サーバーを使う(コンテナ化しない)。
#
#   podman compose -f deploy/compose.yaml up -d --build
#
# 事前に deploy/.env.example をコピーして deploy/.env に本番値を書く:
#   cp deploy/.env.example deploy/.env && vi deploy/.env
# 本番は compose が .env を読んで backend へ渡す(開発は make be_serve が
# 同じ形の deploy/.env.dev を backend に直接読ませる)。キーの説明は .env.example。
# 最低限差し替えるのは MSSQL_DSN / LDAP_* / CONN_ENC_KEY / COOKIE_SECURE。
#
# rootless podman で :80 が使えない場合は "8081:80" に変えるか
# net.ipv4.ip_unprivileged_port_start を調整する。

services:
  backend:
    # image と build を併記してある。ビルドできる環境では build され
    # この名前でタグ付けされ, オフラインの本番では podman load した
    # 同名イメージがそのまま使われる(--build を付けなければビルドしない)。
    # IMAGE_TAG は日付運用(.env 参照)。
    image: localhost/ftool-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ft-backend
    # 設定は .env に集約する(dev の deploy/.env.dev と同じ形・同じ順序。
    # キー一覧と説明は deploy/.env.example)。compose がファイルを読んで
    # コンテナへ渡す(distroless の nonroot ではマウントしたファイルを
    # 読めないことがあるため,マウントではなく env_file を使う)。
    env_file:
      - .env
    # ここで渡すのはコンテナ構成上こうとしか置けない値だけ。environment は
    # env_file より優先されるので .env 側の同名キーは無視される
    # (この2つは .env に書いても書かなくても本番の動作は同じ)。
    environment:
      ADDR: ":8080"
      REDIS_ADDR: redis:6379
    expose:
      - "8080"
    depends_on:
      - redis
    restart: unless-stopped

  # Valkey (Redis 7.2 フォーク,BSD,RESP 互換)。backend 側は変更不要。
  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: ft-redis
    # セッションのみなので永続化しない(再起動 = 全員再ログイン)
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    restart: unless-stopped

  # 監査履歴 detail の 1MB 超過分の退避先(既定で有効。.env の MINIO_ENDPOINT を
  # 空にすると backend が使わなくなる)。ブラウザには公開せず内部ネットワーク限定
  # (expose のみ,ports は無い)。データボリュームはバックアップ対象に含めること
  # (運用手順書 §7 バックアップ / §8.5)。
  # MINIO_ACCESS_KEY / MINIO_SECRET_KEY が空だと MinIO は起動失敗せず
  # 既知の既定値 minioadmin:minioadmin で立ち上がるため, 必ず .env で設定する。
  minio:
    image: docker.io/minio/minio:latest
    container_name: ft-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  frontend:
    # SPA はイメージへ焼き込む(frontend/Dockerfile が node でビルドし
    # nginx へコピーする)。ホストに Node は不要で, backend と版が
    # ずれないよう同じ tar にまとめて配布できる。
    image: localhost/ftool-frontend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # 画面表示用に成果物(version.json)へ焼き込む
        IMAGE_TAG: ${IMAGE_TAG:-latest}
    container_name: ft-frontend
    # 公開先と conf は .env で環境ごとに切り替える(運用・保守手順書 §1.3):
    #   環境A(このコンテナが唯一の受け口)
    #     FRONTEND_BIND=0.0.0.0 / FRONTEND_PORT=80 / NGINX_CONF=standalone.conf
    #   環境B(前段にホスト nginx が居る。既定)
    #     FRONTEND_BIND=127.0.0.1 / FRONTEND_PORT=8081 / NGINX_CONF=default.conf
    #     ひな形: deploy/nginx/host-frontend.conf.example
    # 環境B の 127.0.0.1 は LAN から直接叩かせないための既定 — 直叩きできると
    # クライアントが自前の X-Forwarded-For を送って操作履歴の client_ip を
    # 詐称できる(backend は前段プロキシを信頼する前提で動く)。
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"
    volumes:
      # SPA はイメージ内(/usr/share/nginx/html)にあるためマウントしない。
      # conf だけは環境A/B で X-Forwarded-For の扱いが変わるため差し替える
      # (手編集による切り替えミスを防ぐ。差分は 1 行だけ)。
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  minio-data:

# コンテナ用サブネットを固定する。podman は既定だと 10.89.0.0/16 のプールから
# /24 を作成順に切り出すため,ネットワークを作り直すと 10.89.1.x 等へずれる。
# backend の TRUSTED_PROXIES(X-Forwarded-For を信じる相手)をこの範囲で
# 指定するので,ずれると監査履歴の client_ip が静かに前段の IP になる。
# 社内 LAN と重複しない範囲を選ぶこと(重複すると実クライアントをプロキシと
# 誤認し,IP 詐称を防げなくなる)。
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24
