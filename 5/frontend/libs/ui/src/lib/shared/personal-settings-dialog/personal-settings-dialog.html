<h2 mat-dialog-title class="head">
  <span class="head-title">
    <mat-icon class="ic" aria-hidden="true">tune</mat-icon>
    {{ 'personalSettings.title' | transloco }}
  </span>
  <button class="close" type="button" (click)="close()" [attr.aria-label]="'common.close' | transloco">
    <mat-icon class="ic" aria-hidden="true">close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="body">
  @if (errorMessage(); as msg) {
    <p class="error">{{ msg }}</p>
  }
  <p class="note">{{ 'personalSettings.note' | transloco }}</p>
  <mat-checkbox class="row" [checked]="settings().headerClockSeconds"
    (change)="headerClockSecondsChanged.emit($event.checked)">
    <span class="row-text">
      <span class="row-label">{{ 'personalSettings.headerClockSeconds' | transloco }}</span>
      <span class="row-desc">{{ 'personalSettings.headerClockSecondsDesc' | transloco }}</span>
    </span>
  </mat-checkbox>

  <!-- 動作中イメージのバージョン(IMAGE_TAG)。障害問い合わせ時の特定用 -->
  @if (version()) {
    <p class="version">{{ version() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions class="foot">
  <button class="btn" type="button" (click)="close()">
    {{ 'common.close' | transloco }}
  </button>
</mat-dialog-actions>
