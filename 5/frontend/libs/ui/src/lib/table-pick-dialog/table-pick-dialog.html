@if (open()) {
  <!-- 画面外クリックでは閉じない(誤操作防止)。Esc かボタンで閉じる。 -->
  <div class="backdrop">
    <div class="dialog" role="dialog" aria-modal="true">
      <div class="head">
        <span class="head-title">
          <i class="ti ti-table" aria-hidden="true"></i>
          {{ 'tablePick.title' | transloco }}
        </span>
        <button class="close" type="button" (click)="cancelled.emit()" [attr.aria-label]="'common.close' | transloco">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>

      <div class="body">
        @for (t of tables(); track t.id) {
          <button class="entry" type="button" (click)="tablePicked.emit(t)">
            <i class="entry-icon ti ti-table" aria-hidden="true"></i>
            <span class="entry-text">
              <span class="entry-name">{{ t.displayName }}</span>
              <span class="entry-desc mono">
                @if (t.connectionName) {
                  {{ t.connectionName }}:
                }{{ t.schemaName }}.{{ t.tableName }}
              </span>
            </span>
          </button>
        } @empty {
          <p class="muted">{{ 'tablePick.empty' | transloco }}</p>
        }
      </div>
    </div>
  </div>
}
