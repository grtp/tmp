@if (open()) {
  <!-- 画面外クリックでは閉じない(誤操作防止)。Esc かボタンで閉じる。 -->
  <div class="backdrop">
    <div class="dialog" role="dialog" aria-modal="true">
      <div class="head">
        <span class="head-title">
          <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
          {{ 'templateSelect.title' | transloco }}
        </span>
        <button class="close" type="button" (click)="cancelled.emit()" [attr.aria-label]="'common.close' | transloco">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>

      <div class="body">
        <button class="entry" type="button" [class.selected]="selectedId() === null"
          (click)="templateSelected.emit(null)">
          <i class="entry-icon ti ti-layout-grid" aria-hidden="true"></i>
          <span class="entry-text">
            <span class="entry-name">{{ 'templateSelect.default' | transloco }}</span>
            <span class="entry-desc">{{ 'templateSelect.defaultDesc' | transloco }}</span>
          </span>
          @if (selectedId() === null) {
            <i class="ti ti-check check" aria-hidden="true"></i>
          }
        </button>

        @for (t of templates(); track t.id) {
          <button class="entry" type="button" [class.selected]="selectedId() === t.id"
            (click)="templateSelected.emit(t.id)">
            <i class="entry-icon ti ti-layout-dashboard" aria-hidden="true"></i>
            <span class="entry-text">
              <span class="entry-name">{{ t.name }}</span>
              @if (t.description) {
                <span class="entry-desc">{{ t.description }}</span>
              }
            </span>
            @if (selectedId() === t.id) {
              <i class="ti ti-check check" aria-hidden="true"></i>
            }
          </button>
        } @empty {
          <p class="muted">{{ 'templateSelect.empty' | transloco }}</p>
        }
      </div>
    </div>
  </div>
}
