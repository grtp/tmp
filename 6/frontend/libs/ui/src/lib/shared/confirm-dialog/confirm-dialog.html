@if (open()) {
  <!-- 画面外クリックでは閉じない(誤操作防止)。Esc かボタンで閉じる。 -->
  <div class="backdrop">
    <div class="dialog" role="alertdialog" aria-modal="true">
      <div class="head">
        <i
          class="icon ti"
          [class.ti-alert-triangle]="danger()"
          [class.ti-help-circle]="!danger()"
          [class.danger]="danger()"
          aria-hidden="true"
        ></i>
        <span class="title">{{ title() }}</span>
      </div>
      <p class="message">{{ message() }}</p>
      <div class="foot">
        <button class="btn" type="button" [disabled]="busy()" (click)="cancelled.emit()">
          {{ 'common.cancel' | transloco }}
        </button>
        <button
          class="btn"
          type="button"
          [class.primary]="!danger()"
          [class.danger-btn]="danger()"
          [disabled]="busy()"
          (click)="confirmed.emit()"
        >
          @if (busy()) {
            {{ 'common.processing' | transloco }}
          } @else if (confirmLabel()) {
            {{ confirmLabel() }}
          } @else {
            {{ 'common.execute' | transloco }}
          }
        </button>
      </div>
    </div>
  </div>
}
