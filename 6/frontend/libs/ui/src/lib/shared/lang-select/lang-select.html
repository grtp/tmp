<mat-form-field
  class="lang-field"
  [class.on-primary]="variant() === 'on-primary'"
  appearance="outline"
  subscriptSizing="dynamic"
>
  <mat-select
    panelWidth=""
    [value]="active()"
    (valueChange)="onChange($event)"
    aria-label="Language"
  >
    @for (lang of langs; track lang) {
      <mat-option [value]="lang">{{ labelOf(lang) }}</mat-option>
    }
  </mat-select>
</mat-form-field>
