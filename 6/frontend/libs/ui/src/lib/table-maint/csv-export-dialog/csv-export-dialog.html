@if (open()) {
  <!-- 画面外クリックでは閉じない(誤操作防止)。Esc かボタンで閉じる。 -->
  <div class="backdrop">
    <div class="dialog" role="dialog" aria-modal="true">
      <div class="head">
        <span class="head-title">
          <i class="ti ti-file-export" aria-hidden="true"></i>
          {{ 'csvExport.title' | transloco }}
        </span>
        <button class="close" type="button" (click)="cancelled.emit()" [attr.aria-label]="'common.close' | transloco">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>

      <div class="body">
        <label class="check-field">
          <input type="checkbox" [checked]="excelCompat()" (change)="excelCompat.set($any($event.target).checked)" />
          <span>{{ 'csvExport.excelCompat' | transloco }}</span>
        </label>
        <p class="hint">{{ 'csvExport.excelCompatHint' | transloco }}</p>

        <button class="entry" type="button" [disabled]="selectionCount() === 0 || busy()" (click)="choose('selection')">
          <i class="entry-icon ti ti-list-check" aria-hidden="true"></i>
          <span class="entry-text">
            <span class="entry-name">{{ 'csvExport.selection' | transloco }}</span>
            <span class="entry-desc">{{ 'csvExport.selectionDesc' | transloco: { count: selectionCount() } }}</span>
          </span>
        </button>

        <button class="entry" type="button" [disabled]="busy()" (click)="choose('page')">
          <i class="entry-icon ti ti-file" aria-hidden="true"></i>
          <span class="entry-text">
            <span class="entry-name">{{ 'csvExport.page' | transloco }}</span>
            <span class="entry-desc">{{ 'csvExport.pageDesc' | transloco: { count: pageCount() } }}</span>
          </span>
        </button>

        <button class="entry" type="button" [disabled]="busy()" (click)="choose('all')">
          <i class="entry-icon ti ti-database-export" aria-hidden="true"></i>
          <span class="entry-text">
            <span class="entry-name">{{ 'csvExport.all' | transloco }}</span>
            <span class="entry-desc">{{ 'csvExport.allDesc' | transloco }}</span>
          </span>
        </button>
      </div>

      <div class="foot">
        <button class="btn" type="button" [disabled]="busy()" (click)="cancelled.emit()">
          {{ 'common.cancel' | transloco }}
        </button>
      </div>
    </div>
  </div>
}
