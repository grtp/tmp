@if (errorMessage(); as msg) {
  <p class="error">{{ msg }}</p>
}

<tm-settings-page
  [activeTab]="tab()"
  [visibleTabs]="visibleTabs()"
  [actions]="settingsActions()"
  [dashTemplates]="settingsTemplates()"
  [loading]="loading()"
  (tabChanged)="tab.set($event)"
  (actionToggled)="onActionToggled($event)"
  (actionDeleteClicked)="askActionDelete($event)"
  (templateAddClicked)="openTemplateCreate()"
  (templateEditClicked)="openTemplateEdit($event)"
  (templateToggled)="onTemplateToggled($event)"
  (templateDeleteClicked)="askTemplateDelete($event)"
/>

<tm-template-editor-dialog
  [open]="templateEditorOpen()"
  [mode]="templateEditorMode()"
  [value]="templateDraft()"
  [availableActions]="editorActions()"
  [availableTables]="editorTables()"
  [saving]="saving()"
  [errorMessage]="templateEditorError()"
  (saved)="onTemplateSaved($event)"
  (cancelled)="templateEditorOpen.set(false)"
/>

<tm-confirm-dialog
  [open]="confirmOpen()"
  [title]="confirmTitle()"
  [message]="confirmMessage()"
  [danger]="true"
  [busy]="saving()"
  (confirmed)="onConfirmed()"
  (cancelled)="confirmOpen.set(false)"
/>
