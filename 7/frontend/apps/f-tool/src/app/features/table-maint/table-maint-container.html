@if (errorMessage(); as msg) {
  <p class="error">{{ msg }}</p>
}

<tm-data-table-page
  [tableNames]="[]"
  [selectedTable]="tableLabel()"
  [columns]="columnDefs()"
  [rows]="displayRows()"
  [pendingRows]="pendingDisplayRows()"
  [totalCount]="total()"
  [totalIsCapped]="totalIsCapped()"
  [page]="page()"
  [pageSize]="pageSize()"
  [loading]="loading()"
  [canCreate]="writable()"
  [insertBlockedColumns]="meta()?.insertBlockedColumns ?? []"
  [storageKey]="storageKey()"
  (filtersChanged)="onFiltersChanged($event)"
  (pageChanged)="onPageChanged($event)"
  (pageSizeChanged)="onPageSizeChanged($event)"
  (createClicked)="onCreate()"
  (rowSelected)="onRowSelected($event)"
  (bulkDeleteClicked)="askBulkDelete($event)"
  (savePendingClicked)="onSavePending($event)"
  (csvExportClicked)="openCsvExport($event)"
  (csvFileSelected)="onCsvFile($event)"
/>

<tm-csv-merge-dialog
  [open]="mergeOpen()"
  [columns]="mergeColumns()"
  [rows]="mergeRows()"
  [identityNote]="identityNote()"
  (applied)="onMergeApplied($event)"
  (cancelled)="mergeOpen.set(false)"
/>

<tm-csv-export-dialog
  [open]="csvExportOpen()"
  [selectionCount]="csvSelection().length"
  [pageCount]="rows().length"
  [busy]="csvBusy()"
  (exported)="onCsvExport($event)"
  (cancelled)="csvExportOpen.set(false)"
/>

<tm-row-edit-dialog
  [open]="dialogOpen()"
  [mode]="dialogMode()"
  [columns]="editColumns()"
  [value]="editValue()"
  [errorMessage]="dialogError()"
  [saving]="saving()"
  [canDelete]="writable()"
  (saved)="onSave($event)"
  (deleteClicked)="askDelete()"
  (cancelled)="closeDialog()"
/>

<tm-confirm-dialog
  [open]="confirmOpen()"
  [title]="'confirms.deleteRowTitle' | transloco"
  [message]="'confirms.deleteRowMessage' | transloco"
  [confirmLabel]="'common.delete' | transloco"
  [danger]="true"
  [busy]="saving()"
  (confirmed)="onDelete()"
  (cancelled)="confirmOpen.set(false)"
/>

<tm-confirm-dialog
  [open]="bulkConfirmOpen()"
  [title]="'confirms.bulkDeleteTitle' | transloco"
  [message]="'confirms.bulkDeleteMessage' | transloco: { count: pendingBulkCount() }"
  [confirmLabel]="'common.ok' | transloco"
  [danger]="true"
  [busy]="saving()"
  (confirmed)="onBulkDelete()"
  (cancelled)="bulkConfirmOpen.set(false)"
/>
