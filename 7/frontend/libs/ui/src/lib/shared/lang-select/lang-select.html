<select
  class="lang-select"
  [class.on-primary]="variant() === 'on-primary'"
  (change)="onChange($any($event.target).value)"
  aria-label="Language"
>
  <!-- select の [value] は option 描画とタイミングが競合して先頭に落ちる
       (表示は日本語なのに実言語は英語，の原因)ため selected で指定する -->
  @for (lang of langs; track lang) {
    <option [value]="lang" [selected]="lang === active()">{{ labelOf(lang) }}</option>
  }
</select>
