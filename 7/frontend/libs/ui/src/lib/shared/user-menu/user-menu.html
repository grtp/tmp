<span class="wrap">
  <button
    class="user-btn"
    type="button"
    (click)="open.set(!open())"
    [attr.aria-expanded]="open()"
    [attr.aria-haspopup]="true"
  >
    <i class="ti ti-user" aria-hidden="true"></i>
    {{ userName() }}
    <i class="ti ti-chevron-down caret" [class.up]="open()" aria-hidden="true"></i>
  </button>

  @if (open()) {
    <div class="drawer" role="menu">
      <button class="item" type="button" role="menuitem" (click)="onTop()">
        <i class="ti ti-home" aria-hidden="true"></i>
        {{ 'common.backToTop' | transloco }}
      </button>
      <button class="item" type="button" role="menuitem" (click)="onLogout()">
        <i class="ti ti-logout" aria-hidden="true"></i>
        {{ 'common.logout' | transloco }}
      </button>
    </div>
  }
</span>
