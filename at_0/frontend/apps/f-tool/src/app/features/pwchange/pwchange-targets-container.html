@if (errorMessage(); as msg) {
  <p class="error">{{ msg }}</p>
}

<tm-pwchange-targets-page
  [targets]="rows()"
  [loading]="loading()"
  [alertThreshold]="alertThreshold()"
  [activeTab]="tab()"
  [authCounts]="authCounts()"
  [allAuthCount]="allAuthCount()"
  (tabChanged)="onTabChanged($event)"
  (addClicked)="openCreate()"
  (editClicked)="openEdit($event)"
  (deleteClicked)="askDelete($event)"
  (toggled)="onToggled($event)"
  (permissionClicked)="openAuthDialog($event)"
  (allPermissionClicked)="openAllAuthDialog()"
/>
