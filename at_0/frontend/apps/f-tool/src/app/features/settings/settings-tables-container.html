@if (errorMessage(); as msg) {
  <p class="error">{{ msg }}</p>
}

<tm-settings-page
  [activeTab]="tab()"
  [visibleTabs]="visibleTabs()"
  [managedTables]="settingsTables()"
  [loading]="loading()"
  [tableAuthCounts]="tableAuthCounts()"
  [allTablesAuthCount]="allTablesAuthCount()"
  (tabChanged)="onTabChanged($event)"
  (registerClicked)="openRegister()"
  (tableEditClicked)="openTableEdit($event)"
  (tableToggled)="onTableToggled($event)"
  (tableDeleteClicked)="askTableDelete($event)"
  (tablePermissionClicked)="openTableAuthDialog($event)"
  (allTablesPermissionClicked)="openAllTablesAuthDialog()"
/>
