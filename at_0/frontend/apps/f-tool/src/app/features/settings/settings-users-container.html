@if (errorMessage(); as msg) {
  <p class="error">{{ msg }}</p>
}

<tm-settings-tabs [tabs]="tabs" [activeTab]="tab()" (tabChanged)="onTabChanged($event)">
  @switch (tab()) {
    @case ('users') {
      <tm-users-grid
        [users]="settingsUsers()"
        [actions]="settingsActions()"
        [totalCount]="total()"
        [page]="page()"
        [pageSize]="pageSize()"
        [loading]="loading()"
        [predicates]="predicates()"
        [showUngranted]="showUngrantedUsers()"
        (levelChanged)="onUserLevelChanged($event)"
        (predicatesChange)="onPredicatesChanged($event)"
        (pageChanged)="onPageChanged($event)"
        (pageSizeChanged)="onPageSizeChanged($event)"
        (showUngrantedChange)="onShowUngrantedUsersChanged($event)"
        (addClicked)="openAdd('user')"
        (clearClicked)="onUserClear($event)"
      />
    }
    @case ('groups') {
      <tm-group-auth-grid
        [groups]="settingsGroups()"
        [actions]="settingsActions()"
        [loading]="loading()"
        [showUngranted]="showUngrantedGroups()"
        (levelChanged)="onGroupLevelChanged($event)"
        (showUngrantedChange)="onShowUngrantedGroupsChanged($event)"
        (addClicked)="openAdd('group')"
        (clearClicked)="onGroupClear($event)"
      />
    }
  }
</tm-settings-tabs>
