<div class="tabs-head">
  <nav mat-tab-nav-bar [tabPanel]="tabPanel" [mat-stretch-tabs]="false" class="tabs">
    @for (t of tabs(); track t.id) {
      <a
        mat-tab-link
        tabindex="0"
        [active]="activeTab() === t.id"
        (click)="tabChanged.emit(t.id)"
        (keyup.enter)="tabChanged.emit(t.id)"
      >
        <mat-icon class="ic tab-ic" aria-hidden="true">{{ t.icon }}</mat-icon>
        {{ t.labelKey | transloco }}
      </a>
    }
  </nav>
</div>

<mat-tab-nav-panel #tabPanel>
  <ng-content />
</mat-tab-nav-panel>
