openapi: 3.0.3
info:
  title: F-tool API
  version: 0.1.0
servers:
  - url: /api/v1

tags:
  - name: auth
  - name: tables
  - name: connections
  - name: schema
  - name: admin
  - name: history
  - name: home

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: LDAP(AD) 認証してセッション cookie を発行
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ''
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sid=xxxxx; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: セッションを破棄する
      responses:
        '204':
          description: ログアウト完了
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 現在のユーザーと機能権限を返す
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /managed-tables:
    get:
      tags: [tables]
      operationId: listManagedTables
      summary: 管理対象テーブルの一覧
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [tables]
      operationId: createManagedTable
      summary: テーブルを管理対象として登録 (settings:admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedTableCreate'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedTable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /managed-tables/{id}:
    patch:
      tags: [tables]
      operationId: updateManagedTable
      summary: 管理対象テーブルの表示名などを変更 (settings:admin)
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedTableUpdate'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedTable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tables]
      operationId: deleteManagedTable
      summary: 管理対象から外す (settings:admin)
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
      responses:
        '204':
          description: 削除完了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managed-tables/{id}/meta:
    get:
      tags: [tables]
      operationId: getTableMeta
      summary: テーブルの列定義(フロントの動的描画用)
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managed-tables/{id}/rows:
    get:
      tags: [tables]
      operationId: listRows
      summary: 行データの取得(ページネーション)
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/Preds'
        - name: orderBy
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managed-tables/{id}/rows/export:
    get:
      tags: [tables]
      operationId: exportRows
      summary: 行データを CSV でエクスポート (tables:user+)
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
        - $ref: '#/components/parameters/Preds'
      responses:
        '200':
          description: ''
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managed-tables/{id}/rows/batch:
    post:
      tags: [tables]
      operationId: applyBatch
      summary: 追加・更新・削除を1トランザクションで一括反映 (tables:maintainer+)
      parameters:
        - $ref: '#/components/parameters/ManagedTableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchError'

  /connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: 接続の一覧 (settings:admin)
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [connections]
      operationId: createConnection
      summary: 接続を登録 (settings:admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /connections/{id}:
    patch:
      tags: [connections]
      operationId: updateConnection
      summary: 接続を変更 (settings:admin)
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdate'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: 接続を削除 (settings:admin)
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '204':
          description: 削除完了
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /connections/{id}/test:
    post:
      tags: [connections]
      operationId: testConnection
      summary: 保存済み接続の疎通テスト (settings:admin)
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /connections/test:
    post:
      tags: [connections]
      operationId: testConnectionParams
      summary: 保存前の疎通テスト (settings:admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /schema/tables:
    get:
      tags: [schema]
      operationId: listSchemaTables
      summary: 登録候補テーブルの一覧 (settings:admin)
      parameters:
        - name: connectionId
          in: query
          schema:
            type: integer
        - name: schema
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchemaTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /schema/tables/{schema}/{table}/columns:
    get:
      tags: [schema]
      operationId: previewSchemaTable
      summary: 登録前のカラムプレビュー (settings:admin)
      parameters:
        - name: connectionId
          in: query
          schema:
            type: integer
        - name: schema
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - name: table
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaTablePreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: ユーザー一覧と機能権限 (settings:admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/Preds'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required: [users, total, limit, offset]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWithAuth'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{objectGuid}/auth:
    put:
      tags: [admin]
      operationId: setUserAuth
      summary: ユーザーの機能権限を一括置換 (settings:admin)
      parameters:
        - name: objectGuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    $ref: '#/components/schemas/AuthAssignment'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithAuth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/actions:
    get:
      tags: [admin]
      operationId: listActions
      summary: 機能マスタの全件一覧 (settings:admin)
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Action'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/actions/{id}:
    patch:
      tags: [admin]
      operationId: updateAction
      summary: 機能を変更 (settings:admin)
      parameters:
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionUpdate'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/settings:
    get:
      tags: [me]
      operationId: getMySettings
      summary: 個人設定の取得
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [me]
      operationId: updateMySettings
      summary: 個人設定の変更
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /home-config:
    get:
      tags: [home]
      operationId: getHomeConfig
      summary: ホーム画面設定の取得(ログイン済み全員)
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [home]
      operationId: setHomeConfig
      summary: ホーム画面設定の全置換 (settings:admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeConfigUpdate'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /history:
    get:
      tags: [history]
      operationId: listHistory
      summary: 操作履歴の検索 (history:maintainer+)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/Preds'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /history/export:
    get:
      tags: [history]
      operationId: exportHistory
      summary: 操作履歴を CSV でエクスポート (history:maintainer+)
      parameters:
        - $ref: '#/components/parameters/Preds'
      responses:
        '200':
          description: ''
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /history/{id}/overflow:
    get:
      tags: [history]
      operationId: getHistoryOverflow
      summary: detail が 1MB を超えて退避された全文を取得 (history:maintainer+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid

  parameters:
    ManagedTableId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    Preds:
      name: preds
      in: query
      schema:
        type: string
      example: '[{"column":"val","op":"gt","values":["10"]},{"column":"code","op":"contains","values":["A-","B-"],"negate":true}]'
    ConnectionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    ActionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1

  responses:
    Unauthorized:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_credentials
            - unauthorized
            - forbidden
            - not_found
            - validation_failed
            - conflict
            - ldap_unavailable
            - session_unavailable
            - connection_unavailable
            - internal
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    AuthLevel:
      type: string
      enum: [admin, maintainer, user]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: yamada.taro
        password:
          type: string
          format: password
          minLength: 1

    Me:
      type: object
      required: [username, displayName, actions]
      properties:
        username:
          type: string
          example: yamada.taro
        displayName:
          type: string
          example: 山田 太郎
        email:
          type: string
          example: yamada.taro@example.co.jp
        actions:
          type: array
          items:
            $ref: '#/components/schemas/GrantedAction'

    GrantedAction:
      type: object
      required: [id, code, name, icon, authLevel]
      properties:
        id:
          type: integer
        code:
          type: string
          example: tables
        name:
          type: string
          example: テーブル管理
        icon:
          type: string
          example: table
        authLevel:
          $ref: '#/components/schemas/AuthLevel'

    Connection:
      type: object
      required: [id, name, host, port, databaseName, username, enabled]
      properties:
        id:
          type: integer
        name:
          type: string
          example: 生産管理DB
        host:
          type: string
          example: db2.example.local
        port:
          type: integer
          example: 1433
        databaseName:
          type: string
          example: seisan
        username:
          type: string
          example: svc_ftool
        options:
          type: string
        schemaName:
          type: string
        enabled:
          type: boolean

    ConnectionCreate:
      type: object
      required: [name, host, databaseName, username, password]
      properties:
        name:
          type: string
          maxLength: 128
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          default: 1433
        databaseName:
          type: string
          maxLength: 128
        username:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 1
        options:
          type: string
          maxLength: 256
        schemaName:
          type: string
          maxLength: 128
        enabled:
          type: boolean
          default: true

    ConnectionUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        host:
          type: string
          maxLength: 255
        port:
          type: integer
        databaseName:
          type: string
          maxLength: 128
        username:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
        options:
          type: string
          maxLength: 256
        schemaName:
          type: string
          maxLength: 128
        enabled:
          type: boolean

    ConnectionTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string
        latencyMs:
          type: integer
    ManagedTable:
      type: object
      required: [id, schemaName, tableName, displayName, slug, sortOrder, enabled, writable, createdAt]
      properties:
        id:
          type: integer
        connectionId:
          type: integer
          nullable: true
        connectionName:
          type: string
          nullable: true
        schemaName:
          type: string
          example: dbo
        tableName:
          type: string
          example: products
        displayName:
          type: string
          example: 商品マスタ
        slug:
          type: string
          example: products
        description:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
        writable:
          type: boolean
        readonlyColumns:
          type: array
          items:
            type: string
        hiddenColumns:
          type: array
          items:
            type: string
        fixedColumns:
          type: array
          items:
            $ref: '#/components/schemas/FixedColumn'
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
          nullable: true

    FixedColumn:
      type: object
      required: [name, kind, applyOn]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [literal, now]
        value:
          type: string
          maxLength: 400
        applyOn:
          type: string
          enum: [insert, update, both]

    ManagedTableCreate:
      type: object
      required: [schemaName, tableName, displayName, slug]
      properties:
        connectionId:
          type: integer
          nullable: true
        schemaName:
          type: string
          maxLength: 128
          example: dbo
        tableName:
          type: string
          maxLength: 128
          example: products
        displayName:
          type: string
          maxLength: 128
          example: 商品マスタ
        slug:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'
          example: products
        description:
          type: string
          maxLength: 400
        sortOrder:
          type: integer
          default: 0
        readonlyColumns:
          type: array
          items:
            type: string
        hiddenColumns:
          type: array
          items:
            type: string
        fixedColumns:
          type: array
          items:
            $ref: '#/components/schemas/FixedColumn'

    ManagedTableUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 128
        slug:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'
        description:
          type: string
          maxLength: 400
        sortOrder:
          type: integer
        enabled:
          type: boolean
        readonlyColumns:
          type: array
          items:
            type: string
        hiddenColumns:
          type: array
          items:
            type: string
        fixedColumns:
          type: array
          items:
            $ref: '#/components/schemas/FixedColumn'

    TableMeta:
      type: object
      required: [id, displayName, primaryKey, writable, hasRowVersion, columns]
      properties:
        id:
          type: integer
        connectionId:
          type: integer
          nullable: true
        connectionName:
          type: string
          nullable: true
        schemaName:
          type: string
        tableName:
          type: string
        displayName:
          type: string
        primaryKey:
          type: array
          items:
            type: string
          example: [id]
        writable:
          type: boolean
        hasRowVersion:
          type: boolean
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMeta'
        insertBlockedColumns:
          type: array
          items:
            type: string
    ColumnMeta:
      type: object
      required: [name, type, nullable, readonly]
      properties:
        name:
          type: string
          example: price
        type:
          type: string
          enum: [string, int, decimal, bool, date, datetime, uuid]
        nullable:
          type: boolean
        readonly:
          type: boolean
        required:
          type: boolean
          default: false
        maxLength:
          type: integer
        searchable:
          type: boolean
          default: false
        fixed:
          type: boolean
          default: false
    Row:
      type: object
      additionalProperties: true
    RowPage:
      type: object
      required: [rows, total, limit, offset]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/Row'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PrimaryKey:
      type: object
      additionalProperties: true
      example: { id: 42 }

    BatchRequest:
      type: object
      properties:
        inserts:
          type: array
          items:
            $ref: '#/components/schemas/Row'
        updates:
          type: array
          items:
            type: object
            required: [key, changes]
            properties:
              key:
                $ref: '#/components/schemas/PrimaryKey'
              changes:
                $ref: '#/components/schemas/Row'
              rowVersion:
                type: string
        deletes:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                $ref: '#/components/schemas/PrimaryKey'
              rowVersion:
                type: string
      example:
        inserts:
          - { code: "D-4001", name: "モニター 27インチ", price: 29800, stock: 10 }
        updates:
          - key: { id: 42 }
            changes: { price: 1980 }
            rowVersion: "AAAAAAAAB9E="
        deletes:
          - key: { id: 7 }
            rowVersion: "AAAAAAAAB9I="

    BatchResult:
      type: object
      required: [inserted, updated, deleted]
      properties:
        inserted:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        insertedKeys:
          type: array
          items:
            $ref: '#/components/schemas/PrimaryKey'

    BatchError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            details:
              type: object
              properties:
                operation:
                  type: string
                  enum: [insert, update, delete]
                index:
                  type: integer
                reason:
                  type: string
                  enum: [constraint_violation, row_version_mismatch, not_found, validation]

    SchemaTable:
      type: object
      required: [schemaName, tableName, hasPrimaryKey]
      properties:
        schemaName:
          type: string
          example: dbo
        tableName:
          type: string
          example: orders
        hasPrimaryKey:
          type: boolean

    SchemaTablePreview:
      type: object
      required: [schemaName, tableName, primaryKey, hasRowVersion, columns]
      properties:
        schemaName:
          type: string
        tableName:
          type: string
        primaryKey:
          type: array
          items:
            type: string
        hasRowVersion:
          type: boolean
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMeta'

    Action:
      type: object
      required: [id, code, name, icon, sortOrder, enabled]
      properties:
        id:
          type: integer
        code:
          type: string
          example: tables
        name:
          type: string
          example: テーブル管理
        icon:
          type: string
          example: table
        sortOrder:
          type: integer
        enabled:
          type: boolean

    ActionUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        icon:
          type: string
          maxLength: 64
        sortOrder:
          type: integer
        enabled:
          type: boolean

    UserSettings:
      type: object
      required: [headerClock, headerClockFormat]
      properties:
        headerClock:
          type: string
          enum: [none, minute, second, custom]
        headerClockFormat:
          type: string
    UserSettingsUpdate:
      type: object
      properties:
        headerClock:
          type: string
          enum: [none, minute, second, custom]
        headerClockFormat:
          type: string
          maxLength: 64

    HomeConfig:
      type: object
      required: [config]
      properties:
        config:
          type: string
          nullable: true
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time

    HomeConfigUpdate:
      type: object
      required: [config]
      properties:
        config:
          type: string
          nullable: true
    UserWithAuth:
      type: object
      required: [objectGuid, username, displayName, auth]
      properties:
        objectGuid:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        lastLoginAt:
          type: string
          format: date-time
        auth:
          type: array
          items:
            $ref: '#/components/schemas/UserAuthEntry'

    UserAuthEntry:
      type: object
      required: [actionId, actionCode, authLevel]
      properties:
        actionId:
          type: integer
        actionCode:
          type: string
        authLevel:
          $ref: '#/components/schemas/AuthLevel'

    AuthAssignment:
      type: object
      required: [actionId, authLevel]
      properties:
        actionId:
          type: integer
        authLevel:
          $ref: '#/components/schemas/AuthLevel'

    HistoryEntry:
      type: object
      required: [id, occurredAt, username, actionCode, operation, result]
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        objectGuid:
          type: string
          format: uuid
        username:
          type: string
        actionCode:
          type: string
          example: tables
        operation:
          type: string
          example: rows.batch
        target:
          type: string
          example: dbo.products
        detail:
          type: object
          additionalProperties: true
        result:
          type: string
          enum: [success, failure]
        errorCode:
          type: string
        clientIp:
          type: string

    HistoryPage:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

security:
  - cookieAuth: []
