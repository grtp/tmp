<div class="wrap">
  <div class="cards">
    @for (a of items(); track a.code) {
      <button class="entry" type="button" (click)="actionSelected.emit(a.code)">
        <mat-icon class="ic" aria-hidden="true">{{ a.icon }}</mat-icon>
        <span class="name">{{ a.label }}</span>
      </button>
    } @empty {
      <p class="empty">{{ emptyText() }}</p>
    }
  </div>
</div>
