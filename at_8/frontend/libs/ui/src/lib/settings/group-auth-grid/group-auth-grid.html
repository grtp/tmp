<tm-data-table-page
  [selectedTable]="title()"
  [columns]="columnDefs()"
  [rows]="displayRows()"
  [totalCount]="groups().length"
  [loading]="loading()"
  [canCreate]="false"
  [showMultiSelect]="false"
  [showCsvExport]="false"
  storageKey="ftool.colw:settings:groupAuth"
>
  
  <span toolbarActions class="toolbar-extra">
    <label class="toggle">
      <input type="checkbox" [checked]="showUngranted()"
        (change)="showUngrantedChange.emit($any($event.target).checked)" />
      <span>{{ t('settings.showUngrantedGroups') }}</span>
    </label>
    <button class="tm-btn primary" type="button" [attr.title]="t('settings.addGroupAuth')" (click)="addClicked.emit()">
      <mat-icon class="ic" aria-hidden="true">group_add</mat-icon> <span class="lbl">{{ t('settings.addGroupAuth') }}</span>
    </button>
  </span>
</tm-data-table-page>


<ng-template #groupTpl let-row>
  <mat-icon class="ic group-ic" aria-hidden="true">folder_shared</mat-icon>
  <span class="group-name">{{ rowOf(row)?.name }}</span>
  @if (rowOf(row)?.groupName; as k) {
    <span class="group-key mono">{{ k }}</span>
  }
  @if (rowOf(row)?.description; as d) {
    <span class="group-desc"> {{ d }}</span>
  }
</ng-template>


<ng-template #levelTpl let-row let-col="col">
  <button
    class="tm-level-btn"
    type="button"
    [class.none]="levelOf(row, col) === ''"
    [class.admin]="levelOf(row, col) === 'admin'"
    [matMenuTriggerFor]="levelMenu"
    (click)="$event.stopPropagation()"
  >
    {{ levelLabel(levelOf(row, col)) }}
    <mat-icon class="ic caret" aria-hidden="true">arrow_drop_down</mat-icon>
  </button>
  <mat-menu #levelMenu="matMenu" class="tm-level-menu">
    @for (lv of LEVELS; track lv) {
      <button mat-menu-item type="button"
        [class.selected]="levelOf(row, col) === lv"
        [class.admin]="lv === 'admin'"
        (click)="onLevelChange(row, col, lv)">
        {{ levelLabel(lv) }}
      </button>
    }
  </mat-menu>
</ng-template>


<ng-template #opsTpl let-row>
  @if (hasAny(row)) {
    <button mat-icon-button class="icon-btn danger" type="button"
      (click)="$event.stopPropagation(); onClear(row)"
      [attr.aria-label]="t('settings.clearAuthAria')"
      [attr.title]="t('settings.clearAuthAria')">
      <mat-icon class="ic" aria-hidden="true">group_remove</mat-icon>
    </button>
  }
</ng-template>
